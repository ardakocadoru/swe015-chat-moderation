<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8452c"/>
    </marker>
  </defs>
  <rect width="1600" height="840" fill="#fff"/>

  <!-- inference band -->
  <rect x="20" y="20" width="1560" height="470" fill="#f6f6f4" stroke="#bbb"/>
  <text x="36" y="48" font-size="19" font-weight="bold" fill="#16181d">Inference: app.py, running on the CPU (1 thread), local machine</text>

  <g font-size="15" fill="#16181d" text-anchor="middle">
    <rect x="40" y="80" width="190" height="130" fill="#fff" stroke="#555"/>
    <text x="135" y="108" font-weight="bold">Gradio UI (input)</text>
    <text x="135" y="132">app.py</text>
    <text x="135" y="156">chat text box,</text>
    <text x="135" y="178">model dropdown</text>

    <rect x="270" y="80" width="215" height="130" fill="#fff" stroke="#555"/>
    <text x="377" y="108" font-weight="bold">Normalisation</text>
    <text x="377" y="132">normalize.py (regex)</text>
    <text x="377" y="156">full: classical models</text>
    <text x="377" y="178">light: BERTurk</text>

    <rect x="525" y="80" width="185" height="130" fill="#fff" stroke="#555"/>
    <text x="617" y="108" font-weight="bold">Tokenizer</text>
    <text x="617" y="132">WordPiece</text>
    <text x="617" y="156">32k vocabulary</text>
    <text x="617" y="178">max. 96 tokens</text>

    <rect x="750" y="80" width="265" height="130" fill="#fdeeeb" stroke="#e8452c" stroke-width="2.5"/>
    <text x="882" y="108" font-weight="bold">BERTurk classifier (served)</text>
    <text x="882" y="132">INT8, ONNX Runtime</text>
    <text x="882" y="156">model_int8.onnx</text>
    <text x="882" y="178">output: P(offensive)</text>

    <rect x="1055" y="80" width="250" height="130" fill="#fff" stroke="#555"/>
    <text x="1180" y="108" font-weight="bold">Post-processing</text>
    <text x="1180" y="132">registry.predict_one: threshold</text>
    <text x="1180" y="156">0.54 (tuned on validation)</text>
    <text x="1180" y="178">app.py: mask, latency</text>

    <rect x="1345" y="80" width="215" height="130" fill="#fff" stroke="#555"/>
    <text x="1452" y="108" font-weight="bold">Gradio UI (output)</text>
    <text x="1452" y="132">label + confidence,</text>
    <text x="1452" y="156">masked message,</text>
    <text x="1452" y="178">latency log, comparison</text>
  </g>
  <g stroke="#e8452c" stroke-width="2.5" marker-end="url(#b)">
    <line x1="230" y1="145" x2="268" y2="145"/>
    <line x1="485" y1="145" x2="523" y2="145"/>
    <line x1="710" y1="145" x2="748" y2="145"/>
    <line x1="1015" y1="145" x2="1053" y2="145"/>
    <line x1="1305" y1="145" x2="1343" y2="145"/>
  </g>

  <!-- other models -->
  <rect x="270" y="270" width="1035" height="195" fill="#fff" stroke="#888" stroke-dasharray="6 4"/>
  <text x="286" y="296" font-size="16" font-weight="bold" fill="#16181d">Other models (model dropdown and comparison table), loaded by registry.load_model</text>
  <g font-size="14" fill="#16181d" text-anchor="middle">
    <rect x="286" y="312" width="158" height="135" fill="#f6f6f4" stroke="#999"/>
    <text x="365" y="337" font-weight="bold">Lexicon matcher</text>
    <text x="365" y="360">min. edit distance</text>
    <text x="365" y="383">rules, Python</text>
    <text x="365" y="406">lexicon.py</text>
    <text x="365" y="429" fill="#666">full norm.</text>

    <rect x="455" y="312" width="158" height="135" fill="#f6f6f4" stroke="#999"/>
    <text x="534" y="337" font-weight="bold">tf-idf + LR</text>
    <text x="534" y="360">word + char n-grams</text>
    <text x="534" y="383">FP64, scikit-learn</text>
    <text x="534" y="406">tfidf_model.py</text>
    <text x="534" y="429" fill="#666">full norm.</text>

    <rect x="624" y="312" width="158" height="135" fill="#f6f6f4" stroke="#999"/>
    <text x="703" y="337" font-weight="bold">word2vec + 1D CNN</text>
    <text x="703" y="360">own embeddings</text>
    <text x="703" y="383">FP32, PyTorch</text>
    <text x="703" y="406">w2v_cnn.py</text>
    <text x="703" y="429" fill="#666">full norm.</text>

    <rect x="793" y="312" width="158" height="135" fill="#f6f6f4" stroke="#999"/>
    <text x="872" y="337" font-weight="bold">word2vec + FFN</text>
    <text x="872" y="360">mean/max pooling</text>
    <text x="872" y="383">FP32, PyTorch</text>
    <text x="872" y="406">w2v_ffn.py</text>
    <text x="872" y="429" fill="#666">full norm.</text>

    <rect x="962" y="312" width="158" height="135" fill="#f6f6f4" stroke="#999"/>
    <text x="1041" y="337" font-weight="bold">BERTurk</text>
    <text x="1041" y="360">BertTorchModel</text>
    <text x="1041" y="383">FP32, PyTorch</text>
    <text x="1041" y="406">bert_model.py</text>
    <text x="1041" y="429" fill="#666">light norm.</text>

    <rect x="1131" y="312" width="158" height="135" fill="#f6f6f4" stroke="#999"/>
    <text x="1210" y="337" font-weight="bold">BERTurk ONNX</text>
    <text x="1210" y="360">BertOnnxModel</text>
    <text x="1210" y="383">FP32, ONNX Runtime</text>
    <text x="1210" y="406">model_fp32.onnx</text>
    <text x="1210" y="429" fill="#666">light norm.</text>
  </g>
  <g stroke="#666" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)">
    <line x1="377" y1="210" x2="377" y2="268"/>
    <line x1="1180" y1="270" x2="1180" y2="212"/>
  </g>

  <!-- training band -->
  <rect x="20" y="520" width="1560" height="300" fill="#fff" stroke="#bbb"/>
  <text x="36" y="548" font-size="19" font-weight="bold" fill="#16181d">Training and evaluation: scripts/ (run_pipeline.py); BERTurk fine-tuned on an RTX 4070 GPU, everything else on the CPU</text>
  <g font-size="14.5" fill="#16181d" text-anchor="middle">
    <rect x="40" y="575" width="178" height="125" fill="#f6f6f4" stroke="#777"/>
    <text x="129" y="600" font-weight="bold">01_prepare_data</text>
    <text x="129" y="624">OffensEval-TR 2020</text>
    <text x="129" y="647">train / val (90/10)</text>
    <text x="129" y="670">official test set</text>

    <rect x="243" y="575" width="178" height="125" fill="#f6f6f4" stroke="#777"/>
    <text x="332" y="600" font-weight="bold">02_train_classical</text>
    <text x="332" y="624">lexicon, tf-idf + LR</text>
    <text x="332" y="647">grid search on val</text>

    <rect x="446" y="575" width="178" height="125" fill="#f6f6f4" stroke="#777"/>
    <text x="535" y="600" font-weight="bold">03 / 03b_train_w2v</text>
    <text x="535" y="624">word2vec, FFN, CNN</text>
    <text x="535" y="647">SGD, backprop,</text>
    <text x="535" y="670">early stopping</text>

    <rect x="649" y="575" width="178" height="125" fill="#f6f6f4" stroke="#777"/>
    <text x="738" y="600" font-weight="bold">04_finetune_bert</text>
    <text x="738" y="624">BERTurk + head</text>
    <text x="738" y="647">AdamW, 3 epochs</text>
    <text x="738" y="670">GPU (bf16)</text>

    <rect x="852" y="575" width="178" height="125" fill="#f6f6f4" stroke="#777"/>
    <text x="941" y="600" font-weight="bold">05_export_quantize</text>
    <text x="941" y="624">ONNX export</text>
    <text x="941" y="647">dynamic INT8</text>
    <text x="941" y="670">variant chosen on val</text>

    <rect x="1055" y="575" width="178" height="125" fill="#f6f6f4" stroke="#777"/>
    <text x="1144" y="600" font-weight="bold">06 / 08</text>
    <text x="1144" y="624">benchmark on test:</text>
    <text x="1144" y="647">F1, MB, latency</text>
    <text x="1144" y="670">error analysis</text>

    <rect x="1300" y="575" width="260" height="125" fill="#f6f6f4" stroke="#5b616e"/>
    <text x="1430" y="604" font-weight="bold">Hugging Face Hub</text>
    <text x="1430" y="628">trained weights</text>
    <text x="1430" y="651">(not stored in git)</text>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#a)">
    <line x1="218" y1="637" x2="241" y2="637"/>
    <line x1="421" y1="637" x2="444" y2="637"/>
    <line x1="624" y1="637" x2="647" y2="637"/>
    <line x1="827" y1="637" x2="850" y2="637"/>
    <line x1="1030" y1="637" x2="1053" y2="637"/>
    <line x1="1233" y1="637" x2="1298" y2="637"/>
  </g>
  <text x="1266" y="626" font-size="12.5" text-anchor="middle" fill="#555">07 upload</text>
  <path d="M1430,575 L1430,492" fill="none" stroke="#5b616e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="1420" y="508" font-size="13.5" fill="#5b616e" text-anchor="end">hub.py downloads the weights at the first start (~135 MB)</text>
  <text x="40" y="740" font-size="14" fill="#555">Hyper-parameters, early stopping, thresholds and the quantization variant are selected on the validation split.</text>
  <text x="40" y="762" font-size="14" fill="#555">The official test set is used only for the final evaluation (06_benchmark.py), with the same code path (registry.py) as the app.</text>
  <text x="40" y="784" font-size="14" fill="#555">Outputs: results/results.md, results/tradeoff.png, results/error_analysis.md, results/*.json</text>
</svg>
